version: "3.9"

services:
  # === DATABASE ===
  mysql:
    image: mysql:8.0
    container_name: pettrack-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: pettrack_db
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - pettrack-network
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  # === AUTH SERVICE ===
  auth-service:
    image: ${ACR_LOGIN_SERVER}/pettrack-auth-service:latest
    container_name: pettrack-auth
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: auth_service
      APP_ENV: production
      PORT: 8000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: pettrack_db
      DATABASE_URL: mysql+pymysql://root:${DB_PASSWORD}@mysql:3306/pettrack_db
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - pettrack-network

  # === PETS SERVICE ===
  pets-service:
    image: ${ACR_LOGIN_SERVER}/pettrack-pets-service:latest
    container_name: pettrack-pets
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      APP_NAME: pets_service
      APP_ENV: production
      PORT: 8001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: pettrack_db
      DATABASE_URL: mysql+pymysql://root:${DB_PASSWORD}@mysql:3306/pettrack_db
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - pettrack-network

  # === APPOINTMENT SERVICE ===
  appointment-service:
    image: ${ACR_LOGIN_SERVER}/pettrack-appointment-service:latest
    container_name: pettrack-appointments
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      APP_NAME: appointment_service
      APP_ENV: production
      PORT: 8002
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: pettrack_db
      DATABASE_URL: mysql+pymysql://root:${DB_PASSWORD}@mysql:3306/pettrack_db
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - pettrack-network

  # === REWARDS SERVICE ===
  rewards-service:
    image: ${ACR_LOGIN_SERVER}/pettrack-rewards-service:latest
    container_name: pettrack-rewards
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      APP_NAME: rewards_service
      APP_ENV: production
      PORT: 8004
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: pettrack_db
      DATABASE_URL: mysql+pymysql://root:${DB_PASSWORD}@mysql:3306/pettrack_db
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - pettrack-network

  # === POSTCONSULT SERVICE ===
  postconsult-service:
    image: ${ACR_LOGIN_SERVER}/pettrack-postconsult-service:latest
    container_name: pettrack-postconsult
    restart: unless-stopped
    ports:
      - "8005:8005"
    environment:
      APP_NAME: postconsult_service
      APP_ENV: production
      PORT: 8005
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: pettrack_db
      DATABASE_URL: mysql+pymysql://root:${DB_PASSWORD}@mysql:3306/pettrack_db
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - pettrack-network

  # === API GATEWAY ===
  api-gateway:
    image: ${ACR_LOGIN_SERVER}/pettrack-api-gateway:latest
    container_name: pettrack-api-gateway
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      AUTH_SERVICE_URL: "http://auth-service:8000"
      PETS_SERVICE_URL: "http://pets-service:8001"
      APPOINTMENTS_SERVICE_URL: "http://appointment-service:8002"
      REWARDS_SERVICE_URL: "http://rewards-service:8004"
      POSTCONSULT_SERVICE_URL: "http://postconsult-service:8005"
    depends_on:
      - auth-service
      - pets-service
      - appointment-service
      - rewards-service
      - postconsult-service
    networks:
      - pettrack-network

  # === WEB CLIENT ===
  web-client:
    image: ${ACR_LOGIN_SERVER}/pettrack-web-client:latest
    container_name: pettrack-web
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      VITE_API_GATEWAY: "http://api-gateway:8003"
    depends_on:
      - api-gateway
    networks:
      - pettrack-network

networks:
  pettrack-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
