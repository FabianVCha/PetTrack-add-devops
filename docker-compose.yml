version: "3.9"

services:
  # === POSTGRES DATABASE ====
  postgres:
    image: postgres:18
    container_name: pettrack_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      # 🔹 En Postgres 18, los datos van directamente en /var/lib/postgresql
      - postgres_data:/var/lib/postgresql
      # 🔹 Script SQL que crea las bases y tablas
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend

  # === AUTH SERVICE ===
  auth-service:
    build: ./services/auth-service
    container_name: auth_service
    env_file:
      - ./services/auth-service/.env
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    volumes:
      - ./services/auth-service:/app
    restart: always
    networks:
      - backend

  # === PETS SERVICE ===
  pets-service:
    build: ./services/pets-service
    container_name: pets_service
    env_file:
      - ./services/pets-service/.env
    depends_on:
      - postgres
    ports:
      - "8001:8000"
    volumes:
      - ./services/pets-service:/app
    restart: always
    networks:
      - backend

  # === APPOINTMENTS SERVICE ===
  appointment-service:
    build: ./services/appointment-service
    container_name: appointment_service
    env_file:
      - ./services/appointment-service/.env
    depends_on:
      - postgres
    ports:
      - "8002:8000"
    volumes:
      - ./services/appointment-service:/app
    restart: always
    networks:
      - backend

  # === POSTCONSULT SERVICE ===
  postconsult-service:
    build: ./services/postconsult-service
    container_name: postconsult_service
    env_file:
      - ./services/postconsult-service/.env
    depends_on:
      - postgres
    ports:
      - "8005:8000"
    volumes:
      - ./services/postconsult-service:/app
    restart: always
    networks:
      - backend

  # === REWARDS SERVICE ===
  rewards-service:
    build: ./services/rewards-service
    container_name: rewards_service
    env_file:
      - ./services/rewards-service/.env
    depends_on:
      - postgres
    ports:
      - "8004:8000"
    volumes:
      - ./services/rewards-service:/app
    restart: always
    networks:
      - backend

  # === API GATEWAY ===
  api-gateway:
    build: ./services/api-gateway
    container_name: api_gateway
    ports:
      - "8003:8003"
    env_file:
      - ./services/api-gateway/.env
    environment:
      AUTH_SERVICE_URL: "http://auth-service:8000"
      PETS_SERVICE_URL: "http://pets-service:8000"
      APPOINTMENTS_SERVICE_URL: "http://appointment-service:8000"
      REWARDS_SERVICE_URL: "http://rewards-service:8000"
      POSTCONSULT_SERVICE_URL: "http://postconsult-service:8000"
    depends_on:
      - auth-service
      - pets-service
      - appointment-service
      - rewards-service
      - postconsult-service
    restart: always
    networks:
      - backend

  # === WEB CLIENT ===
  client:
    build: ./clients/web-client
    container_name: web_client
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    environment:
      VITE_API_GATEWAY: "http://api-gateway:8003"
    restart: always
    networks:
      - backend

# === NETWORKS ===
networks:
  backend:
    driver: bridge

# === VOLUMES ===
volumes:
  postgres_data:
