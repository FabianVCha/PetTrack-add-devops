name: Deploy to VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Deploy to VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_PRIVATE_KEY }}
          timeout: 30m
          command_timeout: 30m
          script: |
            # Navegar al directorio
            cd ~
            
            # Clonar o actualizar repositorio
            if [ -d "pettrack/.git" ]; then
              cd pettrack
              git pull origin main
            else
              git clone https://github.com/${{ github.repository }} pettrack
              cd pettrack
            fi
            
            # Crear archivos .env si no existen
            for service in auth-service appointment-service postconsult-service pets-service rewards-service; do
              mkdir -p services/$service
              if [ ! -f services/$service/.env ]; then
                touch services/$service/.env
                echo "Created .env for $service"
              fi
            done
            
            # Build y deploy
            echo "Building and deploying services..."
            docker compose down || true
            docker compose build --no-cache
            docker compose up -d
            docker system prune -f
            
            # Mostrar estado
            echo "Deployment completed!"
            docker compose ps
