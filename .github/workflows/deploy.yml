name: Deploy to VM
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
      
      - name: Copy files to VM
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_rsa -o ServerAliveInterval=60" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='__pycache__' \
            --exclude='.env' \
            --exclude='*.pyc' \
            ./ ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/pettrack/
      
      - name: Trigger deployment on VM
        run: |
          ssh -i ~/.ssh/id_rsa \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=120 \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            'bash -s' << 'ENDSSH'
            cd ~/pettrack
            
            # Crear .env files
            for service in auth-service appointment-service postconsult-service pets-service rewards-service; do
              mkdir -p services/$service
              [ ! -f services/$service/.env ] && touch services/$service/.env
            done
            
            # Build en background para evitar timeout
            nohup bash -c '
              docker compose down
              docker compose build --no-cache
              docker compose up -d
              docker system prune -f
            ' > ~/deploy.log 2>&1 &
            
            echo "✅ Deployment started in background"
            echo "📝 Check logs with: tail -f ~/deploy.log"
          ENDSSH
