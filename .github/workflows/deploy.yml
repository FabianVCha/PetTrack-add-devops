name: Deploy to VM
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
      
      - name: Copy files to VM
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_rsa" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            ./ ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/pettrack/
      
      - name: Deploy with Docker
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'ENDSSH'
            cd ~/pettrack
            
            # Crear archivos .env si no existen
            for service in auth-service appointment-service postconsult-service pets-service rewards-service; do
              mkdir -p services/$service
              if [ ! -f services/$service/.env ]; then
                touch services/$service/.env
              fi
            done
            
            # Deploy con output más verboso
            echo "🔨 Building and starting services..."
            docker compose down
            docker compose build --no-cache  # Construye las imágenes
            docker compose up -d             # Levanta los contenedores
            
            echo "🧹 Cleaning up..."
            docker system prune -f
            
            echo "📊 Services status:"
            docker compose ps
            
            echo "✅ Deployment completed successfully"
          ENDSSH
