name: Deploy to VM
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
      
      - name: Copy files to VM
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_rsa" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            ./ ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/pettrack/
      
      - name: Deploy with Docker
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'ENDSSH'
            cd ~/pettrack
            
            # Verificar que exista docker-compose.yml
            if [ ! -f docker-compose.yml ]; then
              echo "ERROR: docker-compose.yml not found!"
              exit 1
            fi
            
            # Deploy
            docker compose pull || true
            docker compose down
            docker compose up -d --build
            docker system prune -f
            
            echo "✅ Deployment completed successfully"
          ENDSSH
