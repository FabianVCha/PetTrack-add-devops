name: Deploy to VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # Aumenta a 45 minutos
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Deploy to VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_PRIVATE_KEY }}
          timeout: 45m
          command_timeout: 45m
          script: |
            cd ~
            
            if [ -d "pettrack/.git" ]; then
              cd pettrack
              git pull origin main
            else
              git clone https://github.com/${{ github.repository }} pettrack
              cd pettrack
            fi
            
            # Crear .env files
            for service in auth-service appointment-service postconsult-service pets-service rewards-service; do
              mkdir -p services/$service
              [ ! -f services/$service/.env ] && touch services/$service/.env
            done
            
            echo "🔄 Updating services..."
            docker compose down || true
            
            # Build SIN --no-cache para usar cache
            docker compose build
            
            echo "🚀 Starting services..."
            docker compose up -d
            
            echo "🧹 Cleaning up..."
            docker system prune -f
            
            echo "✅ Deployment completed!"
            docker compose ps
